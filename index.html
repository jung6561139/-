<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유진쌤 숙제 확인 폼</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#f2efe9;min-height:100vh;color:#1c1810;}
.topbar{background:#1c1810;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;}
.topbar-title{font-size:15px;font-weight:700;color:#fff;}
.topbar-right{display:flex;gap:8px;align-items:center;}
.topbar-sub{font-size:11px;color:rgba(255,255,255,0.45);}
.toast{font-size:12px;color:#1e8449;background:#d4efdf;padding:3px 10px;border-radius:100px;font-weight:700;display:none;}
.toast.show{display:inline;}
#home{padding:24px 16px 40px;max-width:560px;margin:0 auto;}
.home-title{font-size:22px;font-weight:900;letter-spacing:-0.5px;margin-bottom:4px;}
.home-sub{font-size:13px;color:#9a9088;margin-bottom:24px;}
.class-card{background:#fff;border:1.5px solid #e2dbd0;border-left:5px solid #c0392b;border-radius:12px;padding:18px 20px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(28,24,16,0.07);margin-bottom:12px;transition:transform 0.15s;}
.class-card:hover{transform:translateY(-1px);}
.class-card-name{font-size:17px;font-weight:700;}
.class-card-meta{font-size:12px;color:#9a9088;margin-top:4px;}
.class-card-right{display:flex;gap:8px;align-items:center;}
.pill{font-size:11px;padding:3px 10px;border-radius:100px;font-weight:600;}
.pill-blue{background:#d6e4f0;color:#1a4f8a;}
.pill-green{background:#d4efdf;color:#1e8449;}
.arrow{font-size:20px;color:#9a9088;}
#classview{display:none;}
.classheader{background:#1c1810;padding:12px 20px 16px;position:sticky;top:52px;z-index:90;}
.back-btn{background:none;border:none;color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer;padding:0;margin-bottom:6px;font-family:inherit;display:block;}
.classheader-name{font-size:20px;font-weight:900;color:#fff;}
.classheader-meta{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px;}
.edit-name-btn{background:none;border:none;color:rgba(255,255,255,0.45);font-size:13px;cursor:pointer;padding:0;margin-left:8px;font-family:inherit;}
.weektabs{background:#faf8f5;border-bottom:1px solid #e2dbd0;padding:0 16px;display:flex;overflow-x:auto;position:sticky;top:118px;z-index:80;}
.weektabs::-webkit-scrollbar{display:none;}
.weektab{padding:12px 16px;font-size:13px;font-weight:500;color:#9a9088;cursor:pointer;background:none;border:none;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit;transition:all 0.15s;}
.weektab.active{color:#c0392b;border-bottom-color:#c0392b;font-weight:700;}
.addweek-btn{padding:10px 14px;font-size:18px;color:#9a9088;cursor:pointer;background:none;border:none;font-family:inherit;}
.classcontent{padding:16px 16px 80px;max-width:680px;margin:0 auto;}
.info-card{background:#fff;border:1.5px solid #e2dbd0;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(28,24,16,0.07);}
.section-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#9a9088;text-transform:uppercase;margin-bottom:10px;}
.info-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-label{font-size:11px;color:#9a9088;font-weight:600;margin-bottom:5px;}
.info-input{width:100%;border:1.5px solid #e2dbd0;border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;color:#1c1810;background:#faf8f5;outline:none;transition:border-color 0.15s;}
.info-input:focus{border-color:#1a4f8a;background:#fff;}
.students-card{background:#fff;border:1.5px solid #e2dbd0;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(28,24,16,0.07);}
.students-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #e2dbd0;background:#faf8f5;}
.students-title{font-size:13px;font-weight:700;}
.add-btn{background:#1c1810;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.student-row{border-bottom:1px solid #f0ebe3;padding:12px 16px;display:grid;grid-template-columns:100px 1fr 28px;gap:12px;align-items:start;}
.student-row:last-child{border-bottom:none;}
.name-input{font-size:14px;font-weight:700;font-family:inherit;color:#1c1810;border:none;background:transparent;width:100%;padding:4px 0;border-bottom:1.5px solid #e2dbd0;outline:none;}
.student-fields{display:flex;flex-direction:column;gap:8px;}
.field-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.field-row-top{display:flex;align-items:flex-start;gap:8px;}
.flabel{font-size:11px;color:#9a9088;font-weight:500;min-width:80px;white-space:nowrap;}
.flabel-top{font-size:11px;color:#9a9088;font-weight:500;min-width:80px;white-space:nowrap;padding-top:5px;}
.check-group{display:flex;gap:6px;}
.check-btn{padding:4px 10px;font-size:11px;font-weight:600;border-radius:100px;cursor:pointer;border:1.5px solid #e2dbd0;background:transparent;color:#9a9088;font-family:inherit;transition:all 0.15s;}
.check-btn.done{background:#d4efdf;border-color:#1e8449;color:#1e8449;}
.check-btn.partial{background:#fef9e7;border-color:#d4a017;color:#d4a017;}
.check-btn.undone{background:#e8d5d3;border-color:#c0392b;color:#c0392b;}
.concept-input{flex:1;border:1.5px solid #e2dbd0;border-radius:6px;padding:6px 10px;font-size:12px;font-family:inherit;color:#c0392b;background:#fff9f8;resize:none;min-height:36px;outline:none;}
.concept-input:focus{border-color:#c0392b;}
.score-input{width:64px;border:1.5px solid #e2dbd0;border-radius:6px;padding:5px 8px;font-size:13px;font-family:inherit;font-weight:700;color:#1c1810;background:#faf8f5;text-align:center;outline:none;}
.score-input:focus{border-color:#1a4f8a;}
.score-badge{font-size:11px;padding:2px 8px;border-radius:100px;font-weight:600;}
.del-btn{background:none;border:none;color:#cec5b8;font-size:18px;cursor:pointer;padding:4px;align-self:flex-start;margin-top:2px;}
.del-btn:hover{color:#c0392b;}
.progress-wrap{padding:10px 16px;background:#faf8f5;border-top:1px solid #e2dbd0;display:flex;align-items:center;gap:10px;}
.progress-bar{flex:1;height:6px;background:#e2dbd0;border-radius:100px;overflow:hidden;}
.progress-fill{height:100%;background:#1e8449;border-radius:100px;transition:width 0.3s;}
.progress-text{font-size:11px;color:#9a9088;font-weight:600;white-space:nowrap;}
.empty-students{padding:28px 16px;text-align:center;color:#9a9088;font-size:13px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(28,24,16,0.15);}
.modal h3{font-size:16px;font-weight:800;margin-bottom:6px;}
.modal p{font-size:12px;color:#9a9088;margin-bottom:14px;}
.modal textarea{width:100%;border:1.5px solid #e2dbd0;border-radius:8px;padding:11px 14px;font-size:12px;font-family:inherit;margin-bottom:14px;height:120px;resize:none;outline:none;}
.modal textarea:focus{border-color:#1a4f8a;}
.modal-btns{display:flex;gap:10px;}
.modal-cancel{flex:1;padding:10px;border:1.5px solid #e2dbd0;border-radius:8px;background:none;font-family:inherit;font-size:14px;cursor:pointer;}
.modal-confirm{flex:1;padding:10px;border:none;border-radius:8px;background:#1c1810;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
.export-btn{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;}
.export-btn:hover{background:rgba(255,255,255,0.2);}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">유스트학원 · 국어</span>
  <div class="topbar-right">
    <span class="toast" id="toast">저장됨 ✓</span>
    <button class="export-btn" onclick="showExport()">💾 백업</button>
    <button class="export-btn" onclick="showImport()">📥 복원</button>
    <span class="topbar-sub">유진쌤</span>
  </div>
</div>

<!-- HOME -->

<div id="home">
  <div class="home-title">반 선택</div>
  <div class="home-sub">확인할 반을 눌러서 들어가세요</div>
  <div id="class-grid"></div>
</div>

<!-- CLASS VIEW -->

<div id="classview">
  <div class="classheader">
    <button class="back-btn" onclick="goHome()">← 반 목록</button>
    <div style="display:flex;align-items:center;">
      <span class="classheader-name" id="ch-name"></span>
      <button class="edit-name-btn" onclick="editClassName()">✎</button>
    </div>
    <div class="classheader-meta" id="ch-meta"></div>
  </div>
  <div class="weektabs" id="weektabs"></div>
  <div class="classcontent" id="classcontent"></div>
</div>

<!-- EXPORT MODAL -->

<div class="modal-bg" id="export-modal">
  <div class="modal">
    <h3>💾 데이터 백업</h3>
    <p>아래 텍스트를 전체 복사해서 메모앱이나 카톡에 저장해두세요</p>
    <textarea id="export-text" readonly onclick="this.select()"></textarea>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModals()">닫기</button>
      <button class="modal-confirm" onclick="copyExport()">전체 복사</button>
    </div>
  </div>
</div>

<!-- IMPORT MODAL -->

<div class="modal-bg" id="import-modal">
  <div class="modal">
    <h3>📥 데이터 복원</h3>
    <p>백업해둔 텍스트를 아래에 붙여넣으세요</p>
    <textarea id="import-text" placeholder="백업 텍스트 붙여넣기..."></textarea>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModals()">취소</button>
      <button class="modal-confirm" onclick="doImport()">복원하기</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'yujin_hw_v3';

const DEFAULT = [
  {id:'c1',name:'예원중 1학년',weeks:[]},
  {id:'c2',name:'예원중 2학년',weeks:[]},
  {id:'c3',name:'예원중 3학년',weeks:[]},
  {id:'c4',name:'선화중 2학년',weeks:[]},
  {id:'c5',name:'선화중 3학년',weeks:[]},
];

let classes = [];
let curClassId = null;
let curWeekIdx = 0;

// ── STORAGE ──
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) classes = JSON.parse(raw);
    else classes = JSON.parse(JSON.stringify(DEFAULT));
  } catch(e) {
    classes = JSON.parse(JSON.stringify(DEFAULT));
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(classes));
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  } catch(e) {}
}

// ── EXPORT / IMPORT ──
function showExport() {
  document.getElementById('export-text').value = JSON.stringify(classes);
  document.getElementById('export-modal').classList.add('open');
}
function copyExport() {
  const ta = document.getElementById('export-text');
  ta.select();
  document.execCommand('copy');
  alert('복사됐어요! 메모앱에 붙여넣어서 저장해두세요 😊');
}
function showImport() {
  document.getElementById('import-text').value = '';
  document.getElementById('import-modal').classList.add('open');
}
function doImport() {
  try {
    const val = document.getElementById('import-text').value.trim();
    const parsed = JSON.parse(val);
    if (!Array.isArray(parsed)) throw new Error();
    classes = parsed;
    save();
    closeModals();
    goHome();
    alert('복원됐어요! ✓');
  } catch(e) {
    alert('텍스트가 올바르지 않아요. 백업 텍스트를 그대로 붙여넣어주세요.');
  }
}
function closeModals() {
  document.getElementById('export-modal').classList.remove('open');
  document.getElementById('import-modal').classList.remove('open');
}

// ── HOME ──
function renderHome() {
  const grid = document.getElementById('class-grid');
  grid.innerHTML = '';
  classes.forEach(cls => {
    const total = cls.weeks.length > 0 ? Math.max(...cls.weeks.map(w => w.students.length)) : 0;
    const lastWeek = cls.weeks[cls.weeks.length - 1];
    const done = lastWeek ? lastWeek.students.filter(s => s.textbookCheck === 'done').length : 0;
    const card = document.createElement('div');
    card.className = 'class-card';
    card.innerHTML = `
      <div>
        <div class="class-card-name">${cls.name}</div>
        <div class="class-card-meta">${cls.weeks.length > 0 ? cls.weeks.length + '주차 기록' : '아직 기록 없음'}</div>
      </div>
      <div class="class-card-right">
        ${total > 0 ? `<span class="pill pill-blue">학생 ${total}명</span>` : ''}
        ${done > 0 ? `<span class="pill pill-green">완료 ${done}</span>` : ''}
        <span class="arrow">›</span>
      </div>`;
    card.onclick = () => openClass(cls.id);
    grid.appendChild(card);
  });
}

function goHome() {
  curClassId = null;
  document.getElementById('home').style.display = 'block';
  document.getElementById('classview').style.display = 'none';
  renderHome();
}

// ── CLASS ──
function getClass() { return classes.find(c => c.id === curClassId); }

function openClass(id) {
  curClassId = id;
  const cls = getClass();
  if (!cls) return;
  if (cls.weeks.length === 0) {
    cls.weeks.push(makeWeek(cls.weeks, []));
    save();
  }
  curWeekIdx = cls.weeks.length - 1;
  document.getElementById('home').style.display = 'none';
  document.getElementById('classview').style.display = 'block';
  renderClassHeader();
  renderWeekTabs();
  renderWeekPanel();
}

function renderClassHeader() {
  const cls = getClass();
  document.getElementById('ch-name').textContent = cls.name;
  const total = cls.weeks[curWeekIdx] ? cls.weeks[curWeekIdx].students.length : 0;
  document.getElementById('ch-meta').textContent = `${cls.weeks.length}주차 기록 · 학생 ${total}명`;
}

function editClassName() {
  const cls = getClass();
  const name = prompt('반 이름 변경:', cls.name);
  if (name && name.trim()) {
    cls.name = name.trim();
    save();
    renderClassHeader();
    renderHome();
  }
}

// ── WEEKS ──
function makeWeek(existingWeeks, prevStudents) {
  return {
    id: 'w' + Date.now(),
    label: (existingWeeks.length + 1) + '주차',
    progress: '',
    homework: '',
    students: prevStudents.map(s => ({id: s.id, name: s.name, textbookCheck: 'none', concepts: '', testScore: ''}))
  };
}

function addWeek() {
  const cls = getClass();
  const prev = cls.weeks.length > 0 ? cls.weeks[cls.weeks.length - 1].students : [];
  cls.weeks.push(makeWeek(cls.weeks, prev));
  curWeekIdx = cls.weeks.length - 1;
  save();
  renderWeekTabs();
  renderWeekPanel();
}

function renderWeekTabs() {
  const cls = getClass();
  const container = document.getElementById('weektabs');
  container.innerHTML = '';
  cls.weeks.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'weektab' + (i === curWeekIdx ? ' active' : '');
    btn.textContent = w.label;
    btn.onclick = () => { curWeekIdx = i; renderWeekTabs(); renderWeekPanel(); };
    container.appendChild(btn);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'addweek-btn';
  addBtn.textContent = '＋';
  addBtn.onclick = addWeek;
  container.appendChild(addBtn);
}

// ── WEEK PANEL ──
function renderWeekPanel() {
  const cls = getClass();
  const week = cls.weeks[curWeekIdx];
  const container = document.getElementById('classcontent');
  container.innerHTML = '';
  renderClassHeader();

  // Info
  const info = document.createElement('div');
  info.className = 'info-card';
  info.innerHTML = `
    <div class="section-label">이번 주 수업 정보</div>
    <div class="info-row">
      <div>
        <div class="field-label">진도</div>
        <input class="info-input" id="inp-progress" placeholder="예) 3단원 2~3번 지문" value="${esc(week.progress)}">
      </div>
      <div>
        <div class="field-label">숙제</div>
        <input class="info-input" id="inp-homework" placeholder="예) p.34~36 문제 풀기" value="${esc(week.homework)}">
      </div>
    </div>`;
  info.querySelector('#inp-progress').addEventListener('input', e => { week.progress = e.target.value; save(); });
  info.querySelector('#inp-homework').addEventListener('input', e => { week.homework = e.target.value; save(); });
  container.appendChild(info);

  // Students
  const sc = document.createElement('div');
  sc.className = 'students-card';
  sc.innerHTML = `
    <div class="students-header">
      <span class="students-title">학생별 확인</span>
      <button class="add-btn" id="add-student-btn">+ 학생 추가</button>
    </div>
    <div id="students-list"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      <span class="progress-text" id="prog-text">교과서 필기 완료 0 / 0명</span>
    </div>`;
  sc.querySelector('#add-student-btn').onclick = addStudent;
  container.appendChild(sc);

  week.students.forEach(s => renderStudentRow(s));
  if (week.students.length === 0) {
    document.getElementById('students-list').innerHTML = '<div class="empty-students">학생 추가 버튼을 눌러 등록해주세요</div>';
  }
  updateProgress();
}

function renderStudentRow(student) {
  const list = document.getElementById('students-list');
  const empty = list.querySelector('.empty-students');
  if (empty) empty.remove();

  const cls = getClass();
  const week = cls.weeks[curWeekIdx];
  const row = document.createElement('div');
  row.className = 'student-row';
  row.id = 'sr-' + student.id;

  const cs = student.textbookCheck || 'none';
  const scoreBadge = getScoreBadge(student.testScore);

  row.innerHTML = `
    <div>
      <input class="name-input" placeholder="이름" value="${esc(student.name)}" data-sid="${student.id}">
    </div>
    <div class="student-fields">
      <div class="field-row">
        <span class="flabel">교과서 필기 확인</span>
        <div class="check-group">
          <button class="check-btn ${cs==='done'?'done':''}" data-sid="${student.id}" data-val="done">✓ 완료</button>
          <button class="check-btn ${cs==='partial'?'partial':''}" data-sid="${student.id}" data-val="partial">△ 일부</button>
          <button class="check-btn ${cs==='undone'?'undone':''}" data-sid="${student.id}" data-val="undone">✕ 미완</button>
        </div>
      </div>
      <div class="field-row-top">
        <span class="flabel-top">🔴 약점 개념</span>
        <textarea class="concept-input" data-sid="${student.id}" placeholder="틀린 개념 메모 (빨간펜 표시 항목)">${esc(student.concepts)}</textarea>

```
  </div>
  <div class="field-row">
    <span class="flabel">복습 테스트</span>
    <input class="score-input" data-sid="${student.id}" placeholder="점수" value="${esc(student.testScore)}">
    <span style="font-size:12px;color:#9a9088;">점</span>
    <span class="score-badge-wrap">${scoreBadge}</span>
  </div>
</div>
<button class="del-btn" data-sid="${student.id}">×</button>`;
```

// Events
row.querySelector(’.name-input’).addEventListener(‘input’, e => {
const sid = e.target.dataset.sid;
cls.weeks.forEach(w => { const s = w.students.find(x => x.id === sid); if(s) s.name = e.target.value; });
save();
});

row.querySelectorAll(’.check-btn’).forEach(btn => {
btn.addEventListener(‘click’, () => {
const sid = btn.dataset.sid;
const val = btn.dataset.val;
const s = week.students.find(x => x.id === sid);
if (!s) return;
s.textbookCheck = s.textbookCheck === val ? ‘none’ : val;
save();
// update buttons
row.querySelectorAll(’.check-btn’).forEach(b => {
b.classList.remove(‘done’,‘partial’,‘undone’);
if (s.textbookCheck !== ‘none’ && b.dataset.val === s.textbookCheck) b.classList.add(s.textbookCheck);
});
updateProgress();
});
});

row.querySelector(’.concept-input’).addEventListener(‘input’, e => {
const s = week.students.find(x => x.id === e.target.dataset.sid);
if (s) { s.concepts = e.target.value; save(); }
e.target.style.height = ‘auto’;
e.target.style.height = Math.max(36, e.target.scrollHeight) + ‘px’;
});

row.querySelector(’.score-input’).addEventListener(‘input’, e => {
const s = week.students.find(x => x.id === e.target.dataset.sid);
if (s) { s.testScore = e.target.value; save(); }
row.querySelector(’.score-badge-wrap’).innerHTML = getScoreBadge(e.target.value);
});

row.querySelector(’.del-btn’).addEventListener(‘click’, e => {
const sid = e.target.dataset.sid;
if (!confirm(‘이 학생을 삭제할까요?’)) return;
cls.weeks.forEach(w => { w.students = w.students.filter(s => s.id !== sid); });
save();
row.remove();
if (week.students.length === 0) {
document.getElementById(‘students-list’).innerHTML = ‘<div class="empty-students">학생 추가 버튼을 눌러 등록해주세요</div>’;
}
updateProgress();
renderClassHeader();
});

// auto-resize textarea
setTimeout(() => {
const ta = row.querySelector(’.concept-input’);
if (ta && ta.value) { ta.style.height = ‘auto’; ta.style.height = Math.max(36, ta.scrollHeight) + ‘px’; }
}, 0);

list.appendChild(row);
}

function addStudent() {
const cls = getClass();
const sid = ‘s’ + Date.now();
cls.weeks.forEach(w => w.students.push({id: sid, name: ‘’, textbookCheck: ‘none’, concepts: ‘’, testScore: ‘’}));
save();
const empty = document.getElementById(‘students-list’).querySelector(’.empty-students’);
if (empty) empty.remove();
const week = cls.weeks[curWeekIdx];
renderStudentRow(week.students[week.students.length - 1]);
updateProgress();
renderClassHeader();
// focus name
setTimeout(() => {
const inp = document.querySelector(’#sr-’ + sid + ’ .name-input’);
if (inp) inp.focus();
}, 50);
}

function updateProgress() {
const cls = getClass();
const week = cls.weeks[curWeekIdx];
if (!week) return;
const total = week.students.length;
const done = week.students.filter(s => s.textbookCheck === ‘done’).length;
const pct = total > 0 ? Math.round(done / total * 100) : 0;
const fill = document.getElementById(‘prog-fill’);
const text = document.getElementById(‘prog-text’);
if (fill) fill.style.width = pct + ‘%’;
if (text) text.textContent = `교과서 필기 완료 ${done} / ${total}명`;
}

function getScoreBadge(score) {
const n = parseInt(score);
if (isNaN(n) || score === ‘’) return ‘’;
if (n >= 90) return `<span class="score-badge" style="background:#d4efdf;color:#1e8449;">우수</span>`;
if (n >= 70) return `<span class="score-badge" style="background:#fef9e7;color:#d4a017;">보통</span>`;
return `<span class="score-badge" style="background:#e8d5d3;color:#c0392b;">주의</span>`;
}

function esc(str) {
if (!str) return ‘’;
return String(str).replace(/&/g,’&’).replace(/”/g,’"’).replace(/</g,’<’).replace(/>/g,’>’);
}

// ── INIT ──
load();
renderHome();
</script>
